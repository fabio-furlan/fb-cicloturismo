spring:
  application:
    name: fb-cicloturismo-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  docker:
    compose:
      lifecycle-management: start-only
  mvc:
    problemdetails:
      enabled: true
  # Em produção (Render), a conexão com o Supabase vem das variáveis SPRING_DATASOURCE_URL,
  # SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /docs

app:
  cors:
    origens-permitidas: ${APP_CORS_ORIGENS:http://localhost:5173}
  jwt:
    # Pelo menos 32 caracteres. Em branco, uma chave aleatória é gerada a cada início (só para desenvolvimento).
    segredo: ${APP_JWT_SEGREDO:}
    validade: ${APP_JWT_VALIDADE:8h}
  # Primeiro administrador, criado só enquanto não houver nenhum.
  admin-inicial:
    email: ${APP_ADMIN_EMAIL:}
    nome: ${APP_ADMIN_NOME:Administrador}
    senha: ${APP_ADMIN_SENHA:}

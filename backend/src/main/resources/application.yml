spring:
  application:
    name: fb-cicloturismo-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Carrega etapas, imagens e opcionais de vários roteiros e saídas numa consulta só, em vez de uma por item.
      hibernate.default_batch_fetch_size: 50
  datasource:
    hikari:
      # O pooler do Supabase gratuito aceita poucas conexões por projeto; 5 sobram para uma instância no Render.
      maximum-pool-size: ${APP_DB_POOL_MAXIMO:5}
  # Só para desenvolvimento: sobe o Postgres do compose.yaml. O plugin do Maven não inclui esse módulo no .jar.
  docker:
    compose:
      lifecycle-management: start-only
  mvc:
    problemdetails:
      enabled: true
  # Em produção (Render), a conexão com o Supabase vem das variáveis SPRING_DATASOURCE_URL,
  # SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /docs

app:
  cors:
    origens-permitidas: ${APP_CORS_ORIGENS:http://localhost:5173}
  jwt:
    # Pelo menos 32 caracteres. Em branco, uma chave aleatória é gerada a cada início (só para desenvolvimento).
    segredo: ${APP_JWT_SEGREDO:}
    validade: ${APP_JWT_VALIDADE:8h}
  # Primeiro administrador, criado só enquanto não houver nenhum.
  admin-inicial:
    email: ${APP_ADMIN_EMAIL:}
    nome: ${APP_ADMIN_NOME:Administrador}
    senha: ${APP_ADMIN_SENHA:}

# Blueprint do Render: a API descrita como código. No painel do Render, use New > Blueprint e aponte para este
# repositório. As variáveis com "sync: false" não têm valor aqui de propósito: o Render pede para preenchê-las no
# painel na primeira vez. O passo a passo completo está em docs/deploy.md.
services:
  - type: web
    name: fb-cicloturismo-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    # Mesma região do banco no Supabase (us-east-1): cada requisição faz várias consultas, e a distância entre API e
    # banco pesa mais que a distância entre o visitante e a API.
    region: virginia
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      # O Supabase já cria objetos no esquema public; sem isto o Flyway recusa o esquema "não vazio". A versão 0 faz a
      # V1 e a V2 serem aplicadas normalmente (com o padrão, 1, a V1 seria pulada).
      - key: SPRING_FLYWAY_BASELINE_ON_MIGRATE
        value: "true"
      - key: SPRING_FLYWAY_BASELINE_VERSION
        value: "0"
      # Gerado pelo próprio Render (256 bits aleatórios): o segredo que assina os tokens não passa pelo Git.
      - key: APP_JWT_SEGREDO
        generateValue: true
      # Session pooler do Supabase, no formato jdbc:postgresql://<host>:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Primeiro administrador do painel, criado só enquanto não houver nenhum.
      - key: APP_ADMIN_EMAIL
        sync: false
      - key: APP_ADMIN_SENHA
        sync: false
      # Endereço do site na Vercel, sem barra no fim. Vários endereços separados por vírgula.
      - key: APP_CORS_ORIGENS
        sync: false
